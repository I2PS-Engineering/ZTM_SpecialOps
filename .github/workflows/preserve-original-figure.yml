name: One-time original illustration transfer
on:
  push:
    paths:
      - ".github/workflows/preserve-original-figure.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch and verify the original image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/figures
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/I2PS-Engineering/ZTM_SpecOps/main/assets/figures/01-motorcycle-var-diff-whiteboard.png" \
            --output "assets/figures/01-motorcycle-var-diff-whiteboard.png"
          expected=0d6834d4bd52a91b56da4e12ee2fba7a7885d28c
          actual=$(git hash-object assets/figures/01-motorcycle-var-diff-whiteboard.png)
          test "$actual" = "$expected" || { echo "Original file integrity mismatch"; exit 1; }
      - name: Commit original artwork under I2PS Engineering
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "I2PS ENGINEERING"
          git config user.email "11009497+I2PS-Engineering@users.noreply.github.com"
          git add assets/figures/01-motorcycle-var-diff-whiteboard.png
          git commit -m "Preserve original ZTM mathematical illustration"
          git push origin HEAD:main
