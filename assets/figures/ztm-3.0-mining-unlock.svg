<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="410" viewBox="0 0 1600 410"><rect width="1600" height="410" fill="#0d1728"/><text x="56" y="68" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" fill="#f1f6fc" font-weight="700">ZTM SPECIAL OPS 3.0 STABLE</text><text x="56" y="108" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#adc2dc" font-weight="500">Final results are separate from the machine qualification gate</text><rect x="58" y="144" width="342" height="198" rx="16" fill="#172640" stroke="#456484" stroke-width="2"/><text x="74" y="191" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#55d1d6" font-weight="700">24-HOUR COMPLETE</text><text x="74" y="229" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#f1f6fc" font-weight="500">86,400 qualified seconds</text><text x="74" y="267" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#adc2dc" font-weight="500">Not merely elapsed time</text><path d="M 406 243 h 34 m -12 -10 l 12 10 -12 10" stroke="#55d1d6" stroke-width="4" fill="none"/><rect x="442" y="144" width="342" height="198" rx="16" fill="#172640" stroke="#456484" stroke-width="2"/><text x="458" y="191" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#55d1d6" font-weight="700">REPORT VALIDATED</text><text x="458" y="229" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#f1f6fc" font-weight="500">Same worker and machine</text><text x="458" y="267" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#adc2dc" font-weight="500">Complete candidate evidence</text><path d="M 790 243 h 34 m -12 -10 l 12 10 -12 10" stroke="#55d1d6" stroke-width="4" fill="none"/><rect x="826" y="144" width="342" height="198" rx="16" fill="#172640" stroke="#456484" stroke-width="2"/><text x="842" y="191" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#55d1d6" font-weight="700">FINAL RESULTS</text><text x="842" y="229" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#f1f6fc" font-weight="500">Measured configuration</text><text x="842" y="267" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#adc2dc" font-weight="500">Report and telemetry</text><path d="M 1174 243 h 34 m -12 -10 l 12 10 -12 10" stroke="#55d1d6" stroke-width="4" fill="none"/><rect x="1210" y="144" width="342" height="198" rx="16" fill="#172640" stroke="#456484" stroke-width="2"/><text x="1226" y="191" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#55d1d6" font-weight="700">MINING UNLOCK</text><text x="1226" y="229" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#f1f6fc" font-weight="500">Automatic only on success</text><text x="1226" y="267" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#adc2dc" font-weight="500">Stopped runs stay locked</text><text x="58" y="382" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#ff777a" font-weight="700">STOPPED, FAILED OR INCOMPLETE = MINING REMAINS LOCKED.</text></svg>