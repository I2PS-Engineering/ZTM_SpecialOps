<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480"><rect width="1600" height="480" fill="#0d1728"/><text x="56" y="68" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" fill="#f1f6fc" font-weight="700">ZTM SPECIAL OPS 3.0 STABLE</text><text x="56" y="108" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#adc2dc" font-weight="500">One 86,400-second qualified online session — discovery and sustained winner</text><rect x="55" y="150" width="281" height="241" rx="16" fill="#172640" stroke="#456484" stroke-width="2"/><text x="71" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#55d1d6" font-weight="700">1. AUTO REFERENCE</text><text x="71" y="235" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#f1f6fc" font-weight="500">XMRig's original setting</text><text x="71" y="273" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#adc2dc" font-weight="500">Qualified measurement</text><path d="M 342 270.5 h 34 m -12 -10 l 12 10 -12 10" stroke="#55d1d6" stroke-width="4" fill="none"/><rect x="378" y="150" width="281" height="241" rx="16" fill="#172640" stroke="#456484" stroke-width="2"/><text x="394" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#55d1d6" font-weight="700">2. CHALLENGERS</text><text x="394" y="235" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#f1f6fc" font-weight="500">Hardware-aware workers</text><text x="394" y="273" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#adc2dc" font-weight="500">Linux affinity where legal</text><path d="M 665 270.5 h 34 m -12 -10 l 12 10 -12 10" stroke="#55d1d6" stroke-width="4" fill="none"/><rect x="701" y="150" width="281" height="241" rx="16" fill="#172640" stroke="#456484" stroke-width="2"/><text x="717" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#55d1d6" font-weight="700">3. REF REPEAT</text><text x="717" y="235" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#f1f6fc" font-weight="500">Original setting repeated</text><text x="717" y="273" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#adc2dc" font-weight="500">Measured machine noise</text><path d="M 988 270.5 h 34 m -12 -10 l 12 10 -12 10" stroke="#55d1d6" stroke-width="4" fill="none"/><rect x="1024" y="150" width="281" height="241" rx="16" fill="#172640" stroke="#456484" stroke-width="2"/><text x="1040" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#55d1d6" font-weight="700">4. DECISION</text><text x="1040" y="235" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#f1f6fc" font-weight="500">Noise-floor comparison</text><text x="1040" y="273" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#adc2dc" font-weight="500">Select qualified winner</text><path d="M 1311 270.5 h 34 m -12 -10 l 12 10 -12 10" stroke="#55d1d6" stroke-width="4" fill="none"/><rect x="1347" y="150" width="281" height="241" rx="16" fill="#172640" stroke="#456484" stroke-width="2"/><text x="1363" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#55d1d6" font-weight="700">5. WINNER RUN</text><text x="1363" y="235" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#f1f6fc" font-weight="500">Remainder of 24 hours</text><text x="1363" y="273" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#adc2dc" font-weight="500">Sustained online evidence</text><text x="55" y="439" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#adc2dc" font-weight="500">macOS uses native scheduling; no Linux-style affinity pinning is asserted.</text></svg>